name: Build TriggerHappy (RP2040 Zero)

on:
  push:
    branches: [ dev_test ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build project
        run: |
          platformio run -e waveshare_rp2040_zero -d app/TriggerHappy
          platformio run -e waveshare_rp2040_zero -d app/HexBitr
          platformio run -e waveshare_rp2040_zero -d app/ClockDivider

      - name: Rename .uf2
        run: |
          cp app/TriggerHappy/.pio/build/waveshare_rp2040_zero/firmware.uf2 TriggerHappy.uf2
          cp app/TriggerHappy/manual/TriggerHappyOperationManual.pdf TriggerHappyOperationManual.pdf
          cp app/HexBitr/.pio/build/waveshare_rp2040_zero/firmware.uf2 HexBitr.uf2
          cp app/HexBitr/manual/HexBitrOperationManual.pdf HexBitrOperationManual.pdf
          cp app/ClockDivider/.pio/build/waveshare_rp2040_zero/firmware.uf2 ClockDivider.uf2
          cp app/ClockDivider/manual/ClockDividerOperationManual.pdf ClockDividerOperationManual.pdf

      - name: Create timestamp tag
        run: |
          TZ=Asia/Tokyo date
          TIMESTAMP=$(date +"%Y_%m_%d_%H_%M")
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag "$TIMESTAMP"
          git push origin "$TIMESTAMP"

      - name: Upload TriggerHappy.uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriggerHappy
          path: TriggerHappy.uf2

      - name: Upload HexBitr.uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HexBitr
          path: HexBitr.uf2

      - name: Upload ClockDivider.uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClockDivider
          path: ClockDivider.uf2
